<dl>
<dd>
<div class="attention2-label">Caution</div>
</dd>
<dd>
<div class="attention2">
<div class="list">•  If a fuse is burnt out, inspect the cause and repair the malfunctioning part, and always replace a fuse with one of the specified value. If the fuse is replaced before repairing a malfunction, it may burn out again.</div>
</div>
