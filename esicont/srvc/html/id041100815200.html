<body><a name="id041100815200"></a><p class="servinfo-title"><span class="servinfo-head"></span>BRAKE FLUID INSPECTION</p>
<hr>
<p class="servinfo-title-id" align="right">id041100815200</p>
<p class="list">1.  Verify that the brake fluid level in the brake fluid reserve tank is between the MAX and MIN marks.</p>
<p class="list">
<table class="figure-flame-non">
<tr>
<td>
<table class="figure-non-float" cellspacing="0" bordercolor="black">
<tr>
<td align="center"><img src="images/am2zzw00007389.png"></td>
</tr>
</table>
<div class="figure-caption">am2zzw00007389</div>
</td>
</tr>
</table>
<dl>
<dd>
<div class="list">•  If the brake fluid level is below the MIN mark, add brake fluid.</div>
</dd>
</dl>
</p>
