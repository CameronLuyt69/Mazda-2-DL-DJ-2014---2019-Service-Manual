<body><a name="id091000800100"></a><p class="servinfo-title"><span class="servinfo-head"></span>FUEL-FILLER LID REMOVAL/INSTALLATION</p>
<hr>
<p class="servinfo-title-id" align="right">id091000800100</p>
<p class="list">1.  Remove the bolts.</p>
<p class="list">
<table class="figure-flame">
<tr>
<td width="10mm"></td>
<td>

</td>
</tr>
</table>
</p>
<p class="list">2.  Remove the fastener.</p>
<p class="list"></p>
<p class="list">3.  Remove the fuel-filler lid.</p>
<p class="list"></p>
<p class="list">4.  Install in the reverse order of removal.</p>
<p class="list"></p>
<p class="list">5.  Adjust the fuel-filler lid. (See <font class="extxref-label"><a href="id091000800200.html">FUEL-FILLER LID ADJUSTMENT</a></font>.)</p>
<p class="list"></p>
