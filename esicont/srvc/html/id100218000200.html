<body><a name="id100218000200"></a><p class="servinfo-title"><span class="servinfo-head"></span>NETWORK TEST [SKYACTIV-D 1.5]</p>
<hr>
<p class="servinfo-title-id" align="right">id100218000200</p>
<p class="list">1.  Connect the M-MDS to the DLC-2.</p>
<p class="list"></p>
<p class="list">2.  After the vehicle is identified, select the "NETWORK TEST" from the initialization screen of the M-MDS.</p>
<p class="list"></p>
<p class="list">3.  Verify the unit with a communication error according to the directions on the screen.</p>
<p class="list"></p>
